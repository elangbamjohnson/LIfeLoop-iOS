name: iOS CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      # Debug uses demo data and fake auth/HTTP providers. No Google account or live server is used.
      - name: Run unit, contract, and UI tests
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/LifeLoopDerivedData
        run: scripts/test-ios.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Keep test results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/LifeLoopDerivedData/Logs/Test/*.xcresult
            ${{ runner.temp }}/tests.log
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build Staging and Release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      # Compile connected configurations without launching them or contacting the configured server.
      - name: Build simulator configurations without distribution signing
        shell: bash
        run: |
          xcodebuild -version
          for configuration in Staging Release; do
            xcodebuild \
              -project LifeLoop/LifeLoop.xcodeproj \
              -scheme LifeLoop \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/LifeLoopBuild" \
              -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build-$configuration.log"
          done
      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/build-*.log
          retention-days: 7
          if-no-files-found: warn
